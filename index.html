<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>For My Shona ❤️</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}


body{

    min-height:100vh;
    overflow-x:hidden;
    background:
    radial-gradient(circle at top,#64204f,#080808);

    color:white;

}


.container{

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:25px;

    text-align:center;

}


.page{

    width:100%;
    max-width:390px;

}



/* FLOATING PARTICLES */


.particle{

    position:fixed;

    width:7px;
    height:7px;

    background:#ff9fcf;

    border-radius:50%;

    opacity:.8;

    animation:float 8s linear infinite;

}


@keyframes float{

    from{
        transform:translateY(100vh) scale(.5);
    }


    to{
        transform:translateY(-20vh) scale(1.5);
    }

}



/* MUSIC */

.music{

    position:fixed;

    top:20px;
    right:20px;

    border:none;

    background:#ff5fa2;

    color:white;

    border-radius:50%;

    width:45px;
    height:45px;

    font-size:20px;

}



/* ENVELOPE */


.envelope{

    width:280px;

    height:190px;

    margin:auto;

    position:relative;

    cursor:pointer;

    perspective:1000px;

}



.body{

    position:absolute;

    bottom:0;

    width:100%;

    height:140px;

    background:#ff6fae;

    border-radius:10px;

}



.flap{

    position:absolute;

    top:0;

    width:100%;

    height:120px;

    background:#ff9ac8;

    clip-path:polygon(0 0,100% 0,50% 100%);

    transform-origin:top;

    transition:1.2s;

    z-index:5;

}



.paper{

    position:absolute;

    width:90%;

    height:150px;

    left:5%;

    bottom:0;

    background:white;

    color:#444;

    border-radius:10px;

    padding:20px;

    opacity:0;

    transform:translateY(40px);

    transition:1s;

}



.open .flap{

    transform:rotateX(180deg);

}



.open .paper{

    opacity:1;

    transform:translateY(-70px);

}



.touch{

    margin-top:30px;

    animation:pulse 1.5s infinite;

}



@keyframes pulse{

    50%{

        transform:scale(1.1);

    }

}





/* HEART */


.heart{

    font-size:90px;

    cursor:pointer;

    animation:beat 1.4s infinite;

}



@keyframes beat{

    50%{

        transform:scale(1.2);

    }

}




/* MESSAGE */


.message{

    display:none;

    margin-top:30px;

}



.typing{

    font-size:17px;

    line-height:1.8;

    min-height:220px;

}




button{

    margin-top:25px;

    padding:15px 30px;

    border:none;

    border-radius:40px;

    background:

    linear-gradient(45deg,#ff4f9a,#ff9ac8);

    color:white;

    font-size:16px;

}





/* COUPLE END */


.coupleScene{

    display:none;

    margin-top:40px;

    animation:fade 2s;

}



@keyframes fade{

    from{

        opacity:0;

        transform:translateY(50px);

    }

    to{

        opacity:1;

        transform:none;

    }

}



.sun{

    font-size:50px;

    animation:spin 10s linear infinite;

}


@keyframes spin{

    to{

        transform:rotate(360deg);

    }

}



.boy,
.girl{

    display:inline-block;

    font-size:75px;

    position:relative;

    animation:bounce 2s infinite;

}



.girl{

    animation-delay:.5s;

}



@keyframes bounce{

    50%{

        transform:translateY(-15px);

    }

}



.heartFloat{

    position:absolute;

    top:-20px;

    font-size:25px;

    animation:heartUp 3s infinite;

}



@keyframes heartUp{


from{

    opacity:1;

    transform:translateY(0);

}


to{

    opacity:0;

    transform:translateY(-80px);

}


}



.ground{

    width:220px;

    height:15px;

    margin:10px auto 30px;

    background:#ff9fcf;

    border-radius:50%;

}


</style>

</head>



<body>



<button class="music" onclick="musicToggle()">

🎵

</button>



<audio id="music" loop>

<!-- Add your music file here -->

<!-- <source src="song.mp3"> -->

</audio>




<div class="container">


<div class="page">



<div id="start">


<div class="envelope" onclick="openEnvelope(this)">


<div class="flap"></div>


<div class="body"></div>


<div class="paper">

💌

<br><br>

For My Baby...

</div>


</div>



<div class="touch">

Touch the envelope ❤️

</div>


</div>





<div id="heartPage" style="display:none">


<div class="heart" onclick="openLetter()">

❤️

</div>


<div class="touch">

Touch my heart

</div>


</div>





<div class="message" id="message">


<h2>

My Shona ❤️

</h2>


<br>


<p class="typing" id="text"></p>



<button onclick="forgiveAnimation()">

Touch to forgive me ❤️

</button>



<div class="coupleScene" id="coupleScene">


<div class="sun">

☀️

</div>



<div>


<div class="boy">

🧑🏻

<div class="heartFloat">

❤️

</div>

</div>


<div class="girl">

👩🏻

<div class="heartFloat">

❤️

</div>

</div>


</div>



<div class="ground"></div>



<h2>

Thank you for choosing us ❤️

</h2>



<p style="line-height:1.8;margin-top:20px">


I don't promise to be perfect...

<br><br>


But I promise to keep learning,

keep caring,

and keep choosing you.

<br><br>


You are someone precious to me.

<br><br>


I love you, Baybee ❤️


</p>


</div>


</div>



</div>


</div>





<script>



// particles


for(let i=0;i<60;i++){


let p=document.createElement("div");


p.className="particle";


p.style.left=Math.random()*100+"%";


p.style.animationDelay=Math.random()*8+"s";


p.style.animationDuration=(5+Math.random()*8)+"s";


document.body.appendChild(p);


}




function openEnvelope(el){


el.classList.add("open");


setTimeout(()=>{


document.getElementById("start").style.display="none";


document.getElementById("heartPage").style.display="block";


},1500);



}




function openLetter(){


document.getElementById("heartPage").style.display="none";


document.getElementById("message").style.display="block";



let text=

"I know last night hurt you... ❤️\n\n"+

"You needed me and I wasn't there the way you needed.\n\n"+

"I should have made you feel cared for.\n\n"+

"I'm sorry for making you feel like you cannot rely on me.\n\n"+

"I am not making excuses.\n\n"+

"I cannot change last night, but I can learn from it.\n\n"+

"I want my actions to show you that you matter to me.";





typeWriter(text);



}





function typeWriter(text){


let i=0;


let output=document.getElementById("text");



let timer=setInterval(()=>{


output.innerHTML += text[i]=="\n" ? "<br>" : text[i];


i++;


if(i>=text.length)

clearInterval(timer);



},35);



}





function forgiveAnimation(){


document.querySelector("button").style.display="none";


document.getElementById("text").innerHTML=

"❤️ Thank you for listening to my heart ❤️";



setTimeout(()=>{


document.getElementById("coupleScene").style.display="block";


},1200);



}




function musicToggle(){


let m=document.getElementById("music");


if(m.paused)

m.play();


else

m.pause();



}



</script>



</body>

</html>
